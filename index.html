<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@400;600;700&display=swap">

<title>Stundenplan</title>
<style>
:root{color-scheme:dark;--bg:#070b14;--card:#111a2b;--line:#1f2c46;--ink:#e8eef9;--mute:#8393b0;--acc:#00b8ff;--grn:#00e68a;--amb:#ffa81f;--hot:#ff4565;
 --sans:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono","Space Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;font:16px/1.45 var(--sans);color:var(--ink);background:radial-gradient(90% 32% at 50% 0,#0a2c2c 0,transparent 70%),var(--bg);background-attachment:fixed;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:26px 18px 12px;max-width:640px;margin:auto}
.eye{font:600 11px var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
h1{font:700 clamp(34px,10vw,46px)/1 var(--sans);letter-spacing:-.02em;margin:0;color:var(--acc)}
#sub{margin:10px 0 0;color:var(--mute);font:12px/1.5 var(--mono)}
#sync{flex:none;width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--acc);font-size:22px}
#sync.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
main{max-width:640px;margin:auto;padding:8px 14px}
.bar{display:flex;gap:6px;align-items:center;margin:8px 0 18px}
.bar>button{width:30px;height:56px;font-size:22px;color:var(--mute)}
.chip{flex:1;height:62px;border-radius:16px;background:var(--card);border:1px solid var(--line);font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.chip b{font:700 20px var(--sans);letter-spacing:0;color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#00243a}.chip.on b{color:#00121f}
.chip.dot::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--amb)}
.tl{position:relative;margin-left:44px}
.hl{position:absolute;left:-44px;right:0;border-top:1px dashed #1d2a44;font:11px var(--mono);color:var(--mute)}
.hl span{position:absolute;top:-8px;left:0;background:#080d17;padding-right:4px}
.blk{position:absolute;left:8px;right:0;text-align:left;border-radius:18px;padding:10px 14px;color:var(--ink);background:linear-gradient(135deg,hsl(var(--h) 70% 14%),hsl(var(--h) 60% 9%));border:1px solid hsl(var(--h) 80% 32%);border-left:5px solid hsl(var(--h) 100% 58%);overflow:hidden;display:flex;flex-direction:column;gap:2px}
.blk:active{filter:brightness(1.25)}
.blk b{font:700 19px/1.1 var(--sans);color:hsl(var(--h) 100% 68%)}.blk span{font:12px var(--mono);color:var(--mute)}
.tg{position:absolute;right:10px;top:10px;display:flex;gap:4px}
.tg i{font:600 10px var(--mono);font-style:normal;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#1b2740;color:var(--ink)}
.tg i.hw{background:var(--hot);color:#fff}.tg i.ok{background:var(--grn);color:#00241a}
.blk{transition:background .4s,border-color .4s,filter .2s}
.blk.past{background:linear-gradient(135deg,#161c28,#0f141d);border-color:#262f42;border-left-color:#4b5870}
.blk.past b{color:#7f8da6;font-weight:600}.blk.past span{color:#566380}
.blk.cur{box-shadow:0 0 0 1px hsl(var(--h) 100% 58%),0 0 22px hsl(var(--h) 100% 50%/.35);border-color:hsl(var(--h) 100% 58%)}
.blk.cur b{color:#fff}
.now{position:absolute;left:-44px;right:0;height:2px;background:var(--hot);z-index:2;box-shadow:0 0 10px var(--hot);pointer-events:none;transition:top .6s linear}
.now::after{content:attr(data-t);position:absolute;left:0;top:-9px;font:600 10px var(--mono);color:#fff;background:var(--hot);border-radius:6px;padding:1px 4px}
.now::before{content:"";position:absolute;left:44px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--hot)}
.empty{text-align:center;padding:48px 20px;color:var(--mute)}.empty b{display:block;font:700 26px var(--sans);color:var(--acc);margin-bottom:6px}
.pri{background:var(--acc);color:#00121f;padding:13px 20px;border-radius:14px;font:700 15px var(--sans)}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 16px;font-weight:600;color:var(--ink)}
.td{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid hsl(var(--h) 70% 28%);border-radius:20px;padding:14px;margin-bottom:12px}
.td.dn{opacity:.6}.td.dn .tx b{text-decoration:line-through}
.ck{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid hsl(var(--h) 100% 58%);background:hsl(var(--h) 60% 14%);font-size:20px;line-height:1;color:#00160f}
.dn .ck{background:var(--grn);border-color:var(--grn)}
.tx{flex:1;text-align:left;font-size:15px;color:var(--ink)}.tx b{display:block;font:700 18px var(--sans);color:hsl(var(--h) 100% 68%);margin-bottom:2px}.tx small{color:var(--mute)}
.when{display:inline-flex;align-items:center;gap:8px;margin-top:8px;font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--amb)}
.when::before{content:"";width:12px;height:12px;border-radius:50%;background:currentColor}.when.hot{color:var(--hot)}
h3{font:600 11px var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--mute);margin:26px 0 12px}
label{display:block;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
label.ghost{font:600 14px var(--sans);letter-spacing:0;text-transform:none;color:var(--ink)}
textarea,input{width:100%;font:inherit;color:var(--ink);background:#0a1120;border:1px solid #26354f;border-radius:14px;padding:11px 14px}
textarea{min-height:92px;resize:vertical}
.hint{color:var(--mute);font-size:13px}.row{display:flex;gap:10px;margin-top:16px}.row>*{flex:1}
.sec{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px 18px 18px;margin-bottom:16px}
.sec:nth-child(1){border-color:#0d6a60}.sec:nth-child(2){border-color:#7a5612}.sec:nth-child(3){border-color:#1d4f9a}
.sec h3{font:700 19px var(--sans);letter-spacing:0;text-transform:none;color:var(--acc);margin:16px 0 8px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:4px;width:min(94vw,420px);background:#0d1424;border:1px solid var(--line);padding:5px;border-radius:99px;z-index:5}
nav button{flex:1;white-space:nowrap;padding:12px 4px;border-radius:99px;color:var(--mute);font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
nav button.on{background:var(--acc);color:#00121f}
nav b{margin-left:6px;background:var(--hot);color:#fff;border-radius:99px;padding:1px 7px;font-size:11px}nav b:empty{display:none}
.sheet{position:fixed;inset:0;background:#000b;z-index:9;display:flex;align-items:flex-end;justify-content:center}.sheet[hidden]{display:none}
.card{width:100%;max-width:640px;background:#0f1728;border:1px solid var(--line);border-bottom:0;border-top:4px solid hsl(var(--h) 100% 58%);border-radius:24px 24px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.card h2{font:700 28px/1.05 var(--sans);margin:0;color:hsl(var(--h) 100% 68%)}.card p{margin:6px 0 0;color:var(--mute);font:12px var(--mono)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#16223a;border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:14px;z-index:20;max-width:90vw;font-size:14px}#toast:empty{display:none}
@keyframes sl{from{transform:translateX(calc(var(--dx)*28px));opacity:.3}}
#main.sw{animation:sl .22s ease-out}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

<main id="main"></main>
<nav><button data-t="plan">Plan</button><button data-t="todo">To-do<b id="cnt"></b></button><button data-t="set">Einstellungen</button></nav>

<script>

const lk=l=>l.sub+'|'+l.s;

const fmt=s=>new Date(s).toLocaleString('de-AT',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
const rel=s=>{const n=Math.round((sod(s)-sod(Date.now()))/864e5);return n<=0?'heute':n==1?'morgen':'in '+n+' Tagen'};

// Erinnerung: 2 Tage und 1 Tag vor der nächsten Stunde des Fachs, jeweils ab 17:00

    n.sent=[...new Set([...(n.sent||[]),...passed])];changed=true;

const idbOpen=()=>new Promise((ok,no)=>{const q=indexedDB.open('stundenplan',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>ok(q.result);q.onerror=no});
const idbGet=async()=>{const d=await idbOpen();return new Promise(r=>{const q=d.transaction('k').objectStore('k').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})};
const idbPut=async v=>{const d=await idbOpen();d.transaction('k','readwrite').objectStore('k').put(v,'s')};

<script>
const $=s=>document.querySelector(s),LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const PX=1.5,tm=s=>new Date(s).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
let S=LS('cfg',{url:'',proxy:'',at:0}),L=LS('lessons',[]),N=LS('notes',{}),day=(d=>{d=sod(d);if(d.getDay()==6)d.setDate(d.getDate()+2);if(d.getDay()==0)d.setDate(d.getDate()+1);return d})(new Date()),tab=location.hash=='#todo'?'todo':'plan';
const toast=m=>{$('#toast').textContent=m;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').textContent='',3500)};
const save=()=>{localStorage.setItem('notes',JSON.stringify(N));localStorage.setItem('lessons',JSON.stringify(L));localStorage.setItem('cfg',JSON.stringify(S));idbPut({L,N}).catch(()=>{})};

// ---- Untis-Kalender (iCal) einlesen ----
const dt=v=>{const m=v.match(/(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)?(Z)?/);if(!m)return 0;const a=[+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)];return m[7]?Date.UTC(...a):new Date(...a).getTime()};
function parseICS(t){const o=[];let e=null;
 for(const r of t.replace(/\r?\n[ \t]/g,'').split(/\r?\n/)){
  if(r=='BEGIN:VEVENT')e={};
  else if(r=='END:VEVENT'){if(e&&e.s&&e.e)o.push({sub:(e.sub||'?').trim(),s:e.s,e:e.e,room:e.room||''});e=null}
  else if(e){const i=r.indexOf(':'),k=r.slice(0,i).split(';')[0],v=r.slice(i+1).replace(/\\,/g,',');
   if(k=='DTSTART')e.s=dt(v);else if(k=='DTEND')e.e=dt(v);else if(k=='SUMMARY')e.sub=v;else if(k=='LOCATION')e.room=v}}
 return o.sort((a,b)=>a.s-b.s)}
function take(txt){if(!txt.includes('BEGIN:VCALENDAR'))return false;const x=parseICS(txt);if(!x.length)return false;L=x;S.at=Date.now();save();render();return true}
async function sync(){
 if(!S.url.trim()&&S.m){if(S.m.pw)return syncP();if(S.m.key)return syncM()}
 const u=S.url.trim().replace(/^webcal:/,'https:');if(!u){tab='set';render();return toast('Trage zuerst deinen Untis-Link ein')}
 $('#sync').classList.add('spin');
 const tries=[u,...(S.proxy?[prox(u)]:[]),'https://corsproxy.io/?url='+encodeURIComponent(u)];
 for(const t of tries){try{const r=await fetch(t);if(r.ok&&take(await r.text())){$('#sync').classList.remove('spin');return toast(L.length+' Stunden geladen')}}catch{}}
 $('#sync').classList.remove('spin');toast('Abruf fehlgeschlagen. Eigener Proxy oder Datei-Import hilft (Einstellungen).')}

/*TOTP*/
const b32=s=>{let b='',o=[];for(const c of s.toUpperCase().replace(/[^A-Z2-7]/g,''))b+='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'.indexOf(c).toString(2).padStart(5,'0');for(let i=0;i+8<=b.length;i+=8)o.push(parseInt(b.slice(i,i+8),2));return new Uint8Array(o)};
async function otp(key,t){const k=await crypto.subtle.importKey('raw',b32(key),{name:'HMAC',hash:'SHA-1'},false,['sign']);const c=Math.floor(t/3e4),v=new DataView(new ArrayBuffer(8));v.setUint32(0,Math.floor(c/2**32));v.setUint32(4,c>>>0);const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,v.buffer)),o=h[h.length-1]&15,n=(((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3])%1e6;return String(n).padStart(6,'0')}
/*END*/
// ---- Untis-Mobile-Zugang (inoffizielle JSON-RPC-Schnittstelle, läuft über den Proxy) ----
const prox=u=>S.proxy.includes('{url}')?S.proxy.replace('{url}',encodeURIComponent(u)):S.proxy.trim().split('?')[0]+'?u='+encodeURIComponent(u);
async function rpc(m,method,params){
 const t=Date.now(),auth={user:m.user,otp:await otp(m.key,t),clientTime:t};
 const u='https://'+m.host+'/WebUntis/jsonrpc_intern.do?m='+method+'&school='+encodeURIComponent(m.school)+'&v=i2.2';
 const r=await fetch(prox(u),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:'sp',method,params:[{...params,auth}],jsonrpc:'2.0'})});
 const j=await r.json();if(j.error)throw new Error(j.error.message||'Untis-Fehler');return j.result}
async function syncP(){
 const m=S.m||{};
 if(!(m.pw&&m.user&&m.host&&m.school))return toast('Bitte Schule, Server, Benutzer und Passwort ausfüllen');
 if(!S.proxy)return toast('Dafür brauchst du den Proxy (Cloudflare Worker)');
 $('#sync').classList.add('spin');
 try{
  const r=await fetch(S.proxy.trim().split('?')[0].replace(/\/$/,'')+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({host:m.host,school:m.school,user:m.user,password:m.pw})});
  const j=await r.json();if(j.error)throw new Error(j.error);
  const x=j.lessons.map(l=>({sub:l.sub,s:new Date(l.start).getTime(),e:new Date(l.end).getTime(),room:l.room})).filter(l=>l.s&&l.e).sort((a,b)=>a.s-b.s);
  if(!x.length)throw new Error('Keine Stunden erhalten ('+JSON.stringify(j.debug)+')');
  L=x;S.at=Date.now();save();render();toast(L.length+' Stunden geladen')
 }catch(e){toast('Abruf fehlgeschlagen: '+e.message)}
 $('#sync').classList.remove('spin')}
async function syncM(){
 const m=S.m||{};
 if(!(m.key&&m.user&&m.host&&m.school))return toast('Bitte alle Felder bei „Untis-Zugang“ ausfüllen');
 if(!S.proxy)return toast('Dafür brauchst du den Proxy (Cloudflare Worker)');
 $('#sync').classList.add('spin');
 try{
  const ud=await rpc(m,'getUserData2017',{}),us=ud.userData,a=new Date();a.setDate(a.getDate()-((a.getDay()+6)%7));
  const b=new Date(a);b.setDate(b.getDate()+56),ymd=d=>d.getFullYear()*1e4+(d.getMonth()+1)*100+d.getDate();
  const tt=await rpc(m,'getTimetable2017',{id:us.elemId,type:us.elemType,startDate:ymd(a),endDate:ymd(b),masterDataTimestamp:0,timetableTimestamp:0,timetableTimestamps:[]});
  const md=tt.masterData||ud.masterData||{},nm=(list,id)=>{const x=(list||[]).find(y=>y.id==id);return x?(x.longName||x.name):''};
  const ts=(d,t)=>new Date(Math.floor(d/1e4),Math.floor(d%1e4/100)-1,d%100,Math.floor(t/100),t%100).getTime();
  const x=(tt.timetable.periods||[]).map(p=>{const el=p.elements||[],su=el.find(e=>e.type==3),ro=el.find(e=>e.type==4);
   return{sub:(su&&nm(md.subjects,su.id))||p.lessonText||'Stunde',s:ts(p.date,p.startTime),e:ts(p.date,p.endTime),room:(ro&&((md.rooms||[]).find(y=>y.id==ro.id)||{}).name)||''}}).sort((p,q)=>p.s-q.s);
  if(!x.length)throw new Error('Keine Stunden erhalten');
  L=x;S.at=Date.now();save();render();toast(L.length+' Stunden geladen')
 }catch(e){toast('Abruf fehlgeschlagen: '+e.message)}
 $('#sync').classList.remove('spin')}

// ---- Ansichten ----
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 const dd=s=>new Date(s).toLocaleDateString('de-AT',{day:'numeric',month:'numeric'});
 $('#sub').textContent=(S.at?'Stand '+fmt(S.at):'Noch nicht geladen')+(L.length?' · '+L.length+' Stunden ('+dd(L[0].s)+'–'+dd(L[L.length-1].s)+')':'')+(navigator.onLine?'':' · offline');
 $('#cnt').textContent=openHw().length||'';
 ({plan:rPlan,todo:rTodo,set:rSet})[tab]()}
const empty=()=>`<div class="empty"><b>Noch kein Stundenplan</b>Füge in den Einstellungen deinen Untis-Link ein.<br><br><button class="pri" data-go="set">Einstellungen öffnen</button></div>`;
function rPlan(){
 if(!L.length)return $('#main').innerHTML=empty();
 const mon=new Date(day);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
 const has=d=>L.some(l=>sod(l.s).getTime()==d.getTime());
 const ds=[...Array(7)].map((_,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return x}).filter(x=>x.getDay()%6||has(x));
 const dl=L.filter(l=>sod(l.s).getTime()==day.getTime());
 let h=`<div class="bar"><button data-w="-7" aria-label="Vorige Woche">‹</button>${ds.map(x=>`<button class="chip ${x.getTime()==day.getTime()?'on':''} ${has(x)?'dot':''}" data-d="${x.getTime()}">${x.toLocaleDateString('de-AT',{weekday:'short'})}<b>${x.getDate()}</b></button>`).join('')}<button data-w="7" aria-label="Nächste Woche">›</button></div>`;
 if(!dl.length)return $('#main').innerHTML=h+`<div class="empty"><b>Frei</b>An diesem Tag stehen keine Stunden an.</div>`;
 const h0=new Date(dl[0].s).getHours(),base=day.getTime()+h0*36e5,end=Math.max(...dl.map(l=>l.e)),H=(end-base)/6e4*PX+20;
 const hrs=[];for(let t=base;t<=end+36e5-1;t+=36e5)hrs.push(t);
 h+=`<div class="tl" data-base="${base}" data-end="${end}" style="height:${H}px">`+hrs.map(t=>`<div class="hl" style="top:${(t-base)/6e4*PX}px"><span>${tm(t)}</span></div>`).join('');
 const now=Date.now();if(now>base&&now<end+36e5)h+=`<div class="now" data-t="${tm(now)}" style="top:${(now-base)/6e4*PX}px"></div>`;
 h+=dl.map(l=>{const n=N[lk(l)]||{};return `<button class="blk ${l.e<=now?'past':l.s<=now?'cur':'up'}" data-s="${l.s}" data-e="${l.e}" data-k="${esc(lk(l))}" style="--h:${hue(l.sub)};top:${(l.s-base)/6e4*PX}px;height:${(l.e-l.s)/6e4*PX-4}px"><b>${esc(l.sub)}</b><span>${tm(l.s)}–${tm(l.e)} ${esc(l.room)}</span><div class="tg">${n.note?'<i>Notiz</i>':''}${n.hw?`<i class="${n.done?'ok':'hw'}">${n.done?'erledigt':'HÜ'}</i>`:''}</div></button>`}).join('')+'</div>';
 $('#main').innerHTML=h}
// Zeitlinie + Farben live nachführen (ohne Neuaufbau)
function tick(){
 const t=document.querySelector('.tl');if(tab!='plan'||!t)return;
 const now=Date.now(),base=+t.dataset.base,end=+t.dataset.end;
 t.querySelectorAll('.blk').forEach(b=>{const c=+b.dataset.e<=now?'past':+b.dataset.s<=now?'cur':'up';
  if(!b.classList.contains(c)){b.classList.remove('past','cur','up');b.classList.add(c)}});
 let n=t.querySelector('.now');
 if(now>base&&now<end+36e5){if(!n){n=document.createElement('div');n.className='now';t.appendChild(n)}
  n.style.top=(now-base)/6e4*PX+'px';n.dataset.t=tm(now)}
 else if(n)n.remove()}
setInterval(tick,15000);
const items=()=>L.filter(l=>(N[lk(l)]||{}).hw).map(l=>({l,n:N[lk(l)],nx:nextOf(L,l)}));
const openHw=()=>items().filter(x=>!x.n.done);
function rTodo(){
 const card=x=>`<div class="td ${x.n.done?'dn':''}" style="--h:${hue(x.l.sub)}"><button class="ck" data-c="${esc(lk(x.l))}" aria-label="Erledigt umschalten">${x.n.done?'✓':''}</button><button class="tx" data-k="${esc(lk(x.l))}"><b>${esc(x.l.sub)}</b>${esc(x.n.hw)}<br>${x.nx?`<span class="when ${(sod(x.nx.s)-sod(Date.now()))/864e5<=1?'hot':''}">${rel(x.nx.s)} · ${fmt(x.nx.s)}</span>`:'<small>Keine weitere Stunde bekannt</small>'}</button></div>`;
 const o=openHw().sort((a,b)=>(a.nx?a.nx.s:1e15)-(b.nx?b.nx.s:1e15)),d=items().filter(x=>x.n.done);
 $('#main').innerHTML=(o.length?o.map(card).join(''):`<div class="empty"><b>Alles erledigt</b>Hausübungen trägst du direkt bei der Stunde im Plan ein.</div>`)+(d.length?`<h3>Erledigt</h3>`+d.map(card).join(''):'')}
function rSet(){
 $('#main').innerHTML=`<div class="sec"><h3>Untis-Stundenplan</h3><label for="u">Kalender-Link (iCal)</label><input id="u" value="${esc(S.url)}" placeholder="webcal://… oder https://…" inputmode="url"><p class="hint">In WebUntis: Stundenplan öffnen, Kalender abonnieren / Export, Link kopieren.</p>
 <label for="p">Eigener Proxy (optional)</label><input id="p" value="${esc(S.proxy)}" placeholder="https://dein-worker.workers.dev/?u={url}"><p class="hint">Untis erlaubt Browser-Abrufe oft nicht direkt. Ein eigener Proxy ist am zuverlässigsten.</p>
 <div class="row"><button class="pri" id="go">Jetzt laden</button><label class="ghost" style="margin:0;text-align:center;cursor:pointer">.ics-Datei<input id="f" type="file" accept=".ics,text/calendar" hidden></label></div></div>
 <div class="sec"><h3>Untis-Zugang (ohne iCal)</h3><p class="hint">Daten aus „Zugriff über Untis Mobile“ im Profil (Freigaben). Bleiben nur auf diesem Gerät. Braucht den Proxy.</p>
 <label for="m1">Schule</label><input id="m1" value="${esc((S.m||{}).school)}" placeholder="htl-eisenstadt" autocapitalize="off">
 <label for="m2">Server</label><input id="m2" value="${esc((S.m||{}).host)}" placeholder="schule.webuntis.com" inputmode="url" autocapitalize="off">
 <label for="m3">Benutzer</label><input id="m3" value="${esc((S.m||{}).user)}" autocapitalize="off">
 <label for="m4">Schlüssel (Untis Mobile)</label><input id="m4" type="password" value="${esc((S.m||{}).key)}" autocomplete="off" autocapitalize="off">
 <label for="m5">Passwort (WebUntis)</label><input id="m5" type="password" value="${esc((S.m||{}).pw)}" autocomplete="off">
 <div class="row"><button class="pri" id="gp">Mit Passwort laden</button><button class="ghost" id="gm">Mit Schlüssel laden</button></div></div>
 <div class="sec"><h3>Erinnerungen</h3><p class="hint">Du bekommst 2 Tage und 1 Tag vor der nächsten Stunde des Fachs eine Nachricht (ab 17:00). Am zuverlässigsten, wenn die App installiert ist; ansonsten beim Öffnen.</p><button class="pri" id="nt">Benachrichtigungen erlauben</button></div>`;
 $('#u').onchange=e=>{S.url=e.target.value;save()};$('#p').onchange=e=>{S.proxy=e.target.value;save()};
 $('#go').onclick=()=>{S.url=$('#u').value;S.proxy=$('#p').value;save();tab='plan';sync()};
 $('#f').onchange=async e=>{const f=e.target.files[0];if(f){toast(take(await f.text())?L.length+' Stunden importiert':'Datei nicht lesbar');tab='plan';render()}};
 $('#nt').onclick=enableN;
 for(const [i,k] of [['m1','school'],['m2','host'],['m3','user'],['m4','key'],['m5','pw']])$('#'+i).onchange=e=>{S.m={...(S.m||{}),[k]:e.target.value.trim()};save()};
 const rd=()=>{S.m={school:$('#m1').value.trim(),host:$('#m2').value.trim(),user:$('#m3').value.trim(),key:$('#m4').value.trim(),pw:$('#m5').value.trim()};save();tab='plan'};
 $('#gm').onclick=()=>{rd();syncM()};$('#gp').onclick=()=>{rd();syncP()}}
async function enableN(){
 if(!('Notification' in window))return toast('Dieser Browser unterstützt keine Benachrichtigungen');
 if(await Notification.requestPermission()!='granted')return toast('Benachrichtigungen sind blockiert');
 const r=await navigator.serviceWorker.ready;try{await r.periodicSync.register('due',{minInterval:12*36e5})}catch{}
 toast('Erinnerungen aktiv');runCheck()}
async function runCheck(){
 if(!('serviceWorker' in navigator)||!('Notification' in window)||Notification.permission!='granted')return;
 const r=await navigator.serviceWorker.ready;if(await notifyDue(L,N,r)){save();render()}}

// ---- Stunde bearbeiten ----
function openSheet(k){
 const l=L.find(x=>lk(x)==k);if(!l)return;const n=N[k]||{},nx=nextOf(L,l),s=$('#sheet');
 s.hidden=false;s.innerHTML=`<div class="card" style="--h:${hue(l.sub)}"><h2>${esc(l.sub)}</h2><p>${fmt(l.s)} – ${tm(l.e)} ${esc(l.room)}</p>
 <label for="nn">Notiz</label><textarea id="nn">${esc(n.note||'')}</textarea>
 <label for="hh">Hausübung</label><textarea id="hh">${esc(n.hw||'')}</textarea>
 <p class="hint">${nx?'Fällig zur nächsten Stunde: '+fmt(nx.s):'Keine weitere Stunde dieses Fachs bekannt.'}</p>
 <div class="row"><button class="ghost" id="cx">Abbrechen</button><button class="pri" id="ok">Speichern</button></div></div>`;
 $('#cx').onclick=()=>s.hidden=true;
 $('#ok').onclick=()=>{const note=$('#nn').value.trim(),hw=$('#hh').value.trim();
  if(!note&&!hw)delete N[k];else N[k]={note,hw,done:hw?!!n.done:false,sent:hw==n.hw?(n.sent||[]):[]};
  save();s.hidden=true;render();runCheck()}}

document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-k]');if(!t)return;const d=t.dataset;
 if(d.t){tab=d.t;history.replaceState(0,'','#'+tab);render()}
 else if(d.go){tab=d.go;render()}
 else if(d.d){day=new Date(+d.d);render()}
 else if(d.w){day=new Date(day);day.setDate(day.getDate()+ +d.w);render()}
 else if(d.c){N[d.c].done=!N[d.c].done;if(!N[d.c].done)N[d.c].sent=[];save();render()}
 else if(d.k)openSheet(d.k)});
$('#sheet').onclick=e=>{if(e.target.id=='sheet')e.target.hidden=true};
$('#sync').onclick=sync;

// ---- Wischen: links = nächster Tag, rechts = voriger Tag ----
(()=>{let x0=0,y0=0,ok=false;const m=$('#main');
 m.addEventListener('touchstart',e=>{ok=tab=='plan'&&e.touches.length==1;x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
 m.addEventListener('touchend',e=>{if(!ok)return;ok=false;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;
  const dir=dx<0?1:-1,has=d=>L.some(l=>sod(l.s).getTime()==d.getTime());
  let d=new Date(day);for(let i=0;i<14;i++){d.setDate(d.getDate()+dir);if(d.getDay()%6||has(d))break}
  day=sod(d);render();m.style.setProperty('--dx',dir);m.classList.remove('sw');void m.offsetWidth;m.classList.add('sw')},{passive:true});
 m.addEventListener('touchcancel',()=>ok=false,{passive:true})})();
addEventListener('online',render);addEventListener('offline',render);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();runCheck()}});setInterval(runCheck,60000);

(async()=>{
 try{const s=await idbGet();if(s)for(const k in s.N)if(N[k])N[k].sent=[...new Set([...(N[k].sent||[]),...(s.N[k].sent||[])])]}catch{}
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 render();save();runCheck();
 if((S.url||(S.m&&(S.m.key||S.m.pw)))&&navigator.onLine&&Date.now()-S.at>6*36e5)sync()})();
</script></body></html>
