<html lang="de"><head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@400;600;700&display=swap">

<title>Stundenplan</title>
<style>
:root{color-scheme:dark;--bg:#070b14;--card:#111a2b;--line:#1f2c46;--ink:#e8eef9;--mute:#8393b0;--acc:#00b8ff;--grn:#00e68a;--amb:#ffa81f;--hot:#ff4565;
 --sans:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono","Space Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;font:16px/1.45 var(--sans);color:var(--ink);background:radial-gradient(90% 32% at 50% 0,#0a2c2c 0,transparent 70%),var(--bg);background-attachment:fixed;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:26px 18px 12px;max-width:640px;margin:auto}
.eye{font:600 11px var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
h1{font:700 clamp(34px,10vw,46px)/1 var(--sans);letter-spacing:-.02em;margin:0;color:var(--acc)}
#sub{margin:10px 0 0;color:var(--mute);font:12px/1.5 var(--mono)}
#sync{flex:none;width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--acc);font-size:22px}
#sync.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
main{max-width:640px;margin:auto;padding:8px 14px}
.bar{display:flex;gap:6px;align-items:center;margin:8px 0 18px}
.bar>button{width:30px;height:56px;font-size:22px;color:var(--mute)}
.chip{flex:1;height:62px;border-radius:16px;background:var(--card);border:1px solid var(--line);font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.chip b{font:700 20px var(--sans);letter-spacing:0;color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#00243a}.chip.on b{color:#00121f}
.chip.dot::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--amb)}
.tl{position:relative;margin-left:44px}
.hl{position:absolute;left:-44px;right:0;border-top:1px dashed #1d2a44;font:11px var(--mono);color:var(--mute)}
.hl span{position:absolute;top:-8px;left:0;background:#080d17;padding-right:4px}
.blk{position:absolute;left:8px;right:0;text-align:left;border-radius:18px;padding:10px 14px;color:var(--ink);background:linear-gradient(135deg,hsl(var(--h) 70% 14%),hsl(var(--h) 60% 9%));border:1px solid hsl(var(--h) 80% 32%);border-left:5px solid hsl(var(--h) 100% 58%);overflow:hidden;display:flex;flex-direction:column;gap:2px}
.blk:active{filter:brightness(1.25)}
.blk b{font:700 19px/1.1 var(--sans);color:hsl(var(--h) 100% 68%)}.blk span{font:12px var(--mono);color:var(--mute)}
.tg{position:absolute;right:10px;top:10px;display:flex;gap:4px}
.tg i{font:600 10px var(--mono);font-style:normal;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#1b2740;color:var(--ink)}
.tg i.hw{background:var(--hot);color:#fff}.tg i.ok{background:var(--grn);color:#00241a}
.blk{transition:background .4s,border-color .4s,filter .2s}
.blk.past{background:linear-gradient(135deg,#161c28,#0f141d);border-color:#262f42;border-left-color:#4b5870}
.blk.past b{color:#7f8da6;font-weight:600}.blk.past span{color:#566380}
.blk.cur{box-shadow:0 0 0 1px hsl(var(--h) 100% 58%),0 0 22px hsl(var(--h) 100% 50%/.35);border-color:hsl(var(--h) 100% 58%)}
.blk.cur b{color:#fff}
.now{position:absolute;left:-44px;right:0;height:2px;background:var(--hot);z-index:2;box-shadow:0 0 10px var(--hot);pointer-events:none;transition:top .6s linear}
.now::after{content:attr(data-t);position:absolute;left:0;top:-9px;font:600 10px var(--mono);color:#fff;background:var(--hot);border-radius:6px;padding:1px 4px}
.now::before{content:"";position:absolute;left:44px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--hot)}
.empty{text-align:center;padding:48px 20px;color:var(--mute)}.empty b{display:block;font:700 26px var(--sans);color:var(--acc);margin-bottom:6px}
.pri{background:var(--acc);color:#00121f;padding:13px 20px;border-radius:14px;font:700 15px var(--sans)}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 16px;font-weight:600;color:var(--ink)}
.td{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid hsl(var(--h) 70% 28%);border-radius:20px;padding:14px;margin-bottom:12px}
.td.dn{opacity:.6}.td.dn .tx b{text-decoration:line-through}
.ck{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid hsl(var(--h) 100% 58%);background:hsl(var(--h) 60% 14%);font-size:20px;line-height:1;color:#00160f}
.dn .ck{background:var(--grn);border-color:var(--grn)}
.tx{flex:1;text-align:left;font-size:15px;color:var(--ink)}.tx b{display:block;font:700 18px var(--sans);color:hsl(var(--h) 100% 68%);margin-bottom:2px}.tx small{color:var(--mute)}
.when{display:inline-flex;align-items:center;gap:8px;margin-top:8px;font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--amb)}
.when::before{content:"";width:12px;height:12px;border-radius:50%;background:currentColor}.when.hot{color:var(--hot)}
h3{font:600 11px var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--mute);margin:26px 0 12px}
label{display:block;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
label.ghost{font:600 14px var(--sans);letter-spacing:0;text-transform:none;color:var(--ink)}
textarea,input{width:100%;font:inherit;color:var(--ink);background:#0a1120;border:1px solid #26354f;border-radius:14px;padding:11px 14px}
textarea{min-height:92px;resize:vertical}
.hint{color:var(--mute);font-size:13px}.row{display:flex;gap:10px;margin-top:16px}.row>*{flex:1}
.sec{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px 18px 18px;margin-bottom:16px}
.sec:nth-child(1){border-color:#0d6a60}.sec:nth-child(2){border-color:#7a5612}.sec:nth-child(3){border-color:#1d4f9a}
.sec h3{font:700 19px var(--sans);letter-spacing:0;text-transform:none;color:var(--acc);margin:16px 0 8px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:4px;width:min(94vw,420px);background:#0d1424;border:1px solid var(--line);padding:5px;border-radius:99px;z-index:5}
nav button{flex:1;white-space:nowrap;padding:12px 4px;border-radius:99px;color:var(--mute);font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
nav button.on{background:var(--acc);color:#00121f}
nav b{margin-left:6px;background:var(--hot);color:#fff;border-radius:99px;padding:1px 7px;font-size:11px}nav b:empty{display:none}
.sheet{position:fixed;inset:0;background:#000b;z-index:9;display:flex;align-items:flex-end;justify-content:center}.sheet[hidden]{display:none}
.card{width:100%;max-width:640px;background:#0f1728;border:1px solid var(--line);border-bottom:0;border-top:4px solid hsl(var(--h) 100% 58%);border-radius:24px 24px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.card h2{font:700 28px/1.05 var(--sans);margin:0;color:hsl(var(--h) 100% 68%)}.card p{margin:6px 0 0;color:var(--mute);font:12px var(--mono)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#16223a;border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:14px;z-index:20;max-width:90vw;font-size:14px}#toast:empty{display:none}
nav{transition:transform .25s ease}nav.hide{transform:translate(-50%,calc(100% + 28px))}
nav button{font-size:10px;letter-spacing:.02em;padding:12px 2px}
.card{max-height:92vh;overflow:auto}
select{width:100%;font:inherit;color:var(--ink);background:#0a1120;border:1px solid #26354f;border-radius:14px;padding:11px 14px}
.nbar{display:flex;flex-direction:column;gap:10px;margin:8px 0 16px}.nbar .row2{display:flex;gap:10px}.nbar .row2>*{flex:1;min-width:0}.nbar .ghost{padding:11px 10px;font-size:13px}
.nc{background:var(--card);border:1px solid hsl(var(--h) 70% 28%);border-left:5px solid hsl(var(--h) 100% 58%);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.nc .nt{display:block;width:100%;text-align:left}.nc .nt b{display:block;font:700 18px var(--sans);color:hsl(var(--h) 100% 68%)}.nc .nt small{font:11px var(--mono);color:var(--mute)}
.nc .nt p{margin:6px 0 0;color:var(--ink);font:15px/1.4 var(--sans);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.au{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}.au .du{flex:1;min-width:90px;font:600 13px var(--mono);color:var(--ink)}.au .du small{display:block;font:11px var(--mono);color:var(--mute)}
.pl{flex:none;width:40px;height:40px;border-radius:50%;background:var(--acc);color:#00121f;font-size:15px}
.au .sm{padding:8px 12px;font-size:13px;border-radius:12px}.tr{flex-basis:100%;min-height:70px}
.rec{width:100%;background:#2a1420;border:1px solid var(--hot);color:#ff8aa0;border-radius:14px;padding:12px;font-weight:700}.rec.on{background:var(--hot);color:#fff;animation:pu 1.2s infinite}@keyframes pu{50%{opacity:.7}}
.lv{margin-top:8px;padding:10px 12px;border-radius:12px;background:#0a1120;border:1px dashed #26354f;color:var(--mute);font-size:14px}
.fzs{display:flex;flex-wrap:wrap;gap:8px}.chip2{padding:9px 12px;border-radius:99px;background:#0a1120;border:1px solid #26354f;font:600 13px var(--sans);color:var(--ink)}.chip2.on{background:hsl(var(--h) 100% 58%);color:#00121f;border-color:transparent}
@keyframes sl{from{transform:translateX(calc(var(--dx)*28px));opacity:.3}}
#main.sw{animation:sl .22s ease-out}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

<header><div><div class="eye">Untis · Wochenplan</div><h1>Stundenplan</h1><p id="sub"></p></div><button id="sync" aria-label="Stundenplan aktualisieren">⟳</button></header>
<main id="main"></main>
<nav><button data-t="plan">Plan</button><button data-t="todo">To-do<b id="cnt"></b></button><button data-t="notes">Notizen</button><button data-t="set">Einstellungen</button></nav>
<div id="sheet" class="sheet" hidden></div><div id="toast" role="status"></div>
<script>
// Gemeinsam genutzt von index.html und sw.js
const lk=l=>l.sub+'|'+l.s;
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const nextOf=(L,l)=>L.filter(x=>(x.f||x.sub)===(l.f||l.sub)&&x.s>l.s).sort((a,b)=>a.s-b.s)[0];
const fmt=s=>new Date(s).toLocaleString('de-AT',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
const rel=s=>{const n=Math.round((sod(s)-sod(Date.now()))/864e5);return n<=0?'heute':n==1?'morgen':'in '+n+' Tagen'};

// Erinnerung: 2 Tage und 1 Tag vor der nächsten Stunde des Fachs, jeweils ab 17:00
async function notifyDue(L,N,reg){
  let changed=false,now=Date.now();
  for(const l of L){
    const n=N[lk(l)];if(!n||!n.hw||n.done)continue;
    const nx=nextOf(L,l);if(!nx||now>=nx.s)continue;
    const passed=[2,1].filter(d=>{const t=new Date(nx.s);t.setDate(t.getDate()-d);t.setHours(17,0,0,0);return now>=t.getTime()});
    if(!passed.some(d=>!(n.sent||[]).includes(d)))continue;
    n.sent=[...new Set([...(n.sent||[]),...passed])];changed=true;

<script>

const b32=s=>{let b='',o=[];for(const c of s.toUpperCase().replace(/[^A-Z2-7]/g,''))b+='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'.indexOf(c).toString(2).padStart(5,'0');for(let i=0;i+8<=b.length;i+=8)o.push(parseInt(b.slice(i,i+8),2));return new Uint8Array(o)};

   x.onend=()=>{r.acc+=r.cur+' ';r.cur='';if(r.on&&!fatal)setTimeout(go,200)};
   try{x.start()}catch{}};go()}}
function recStop(){if(!R||R.t1)return;R.t1=Date.now();R.on=false;try{R.sr&&R.sr.stop()}catch{}if(R.mr.state!='inactive')R.mr.stop();recUi()}
async function recDone(r,ch,mt){
 r.st.getTracks().forEach(t=>t.stop());clearInterval(r.iv);
 await new Promise(z=>setTimeout(z,400));
 const text=(r.acc+r.cur).trim(),b=new Blob(ch,{type:mt||'audio/webm'}),id='a'+Date.now().toString(36);
 R=null;recUi();
 if(b.size<800)return toast('Aufnahme war zu kurz');
 try{await aPut(id,b)}catch{return toast('Audio konnte nicht gespeichert werden')}
 const n=N[r.k]||(N[r.k]={note:'',hw:'',done:false,sent:[]});(n.audio=n.audio||[]).push({id,t:r.t0,dur:Math.max(1,Math.round(((r.t1||Date.now())-r.t0)/1000)),text});
 save();const re=()=>curK==r.k?drawAl():render();re();
 if(S.proxy&&await transcribe(r.k,id,true))re()}
const closeSheet=()=>{recStop();stopAP();$('#sheet').hidden=true;curK=''};

// ---- Stunde bearbeiten ----
function fzDraw(l){const c=$('#fz');if(!c)return;
 c.innerHTML=SPLIT.list.map(f=>`<button class="chip2 ${l.f==f?'on':''}" data-fz="${esc(f)}">${esc(f)}</button>`).join('');
 $('#fzh').textContent='Gilt für alle Stunden '+(l.code?'mit Kürzel '+l.code+(l.teacher?' ('+l.teacher+')':''):'am gleichen Wochentag zur gleichen Uhrzeit')+'. Nochmal tippen hebt die Auswahl auf.';
 $('#cd').style.setProperty('--h',hue(fh(l)));$('#cd h2').textContent=fh(l)}
function setFz(f){const l=L.find(x=>lk(x)==curK);if(!l)return;S.fz=S.fz||{};const g=gk(l);if(S.fz[g]==f)delete S.fz[g];else S.fz[g]=f;save();fzDraw(l);render()}
function openSheet(k){
 const l=L.find(x=>lk(x)==k);if(!l)return;const n=N[k]||{},nx=nextOf(L,l),s=$('#sheet');curK=k;
 s.hidden=false;s.innerHTML=`<div class="card" id="cd" style="--h:${hue(fh(l))}"><h2>${esc(fh(l))}</h2><p>${fmt(l.s)} – ${tm(l.e)} ${esc(l.room)}${l.code?' · '+esc(l.code):''}${l.teacher?' · '+esc(l.teacher):''}</p>
 ${SPLIT.re.test(l.sub)?'<label>Fach</label><div class="fzs" id="fz"></div><p class="hint" id="fzh"></p>':''}
 <label for="nn">Notiz</label><textarea id="nn">${esc(n.note||'')}</textarea>
 <label>Audionotiz</label><button class="rec" id="rb"></button><div class="lv" id="lv" hidden></div><div id="al"></div>
 <label for="hh">Hausübung</label><textarea id="hh">${esc(n.hw||'')}</textarea>
 <p class="hint">${nx?'Fällig zur nächsten Stunde: '+fmt(nx.s):'Keine weitere Stunde dieses Fachs bekannt.'}</p>
 <div class="row"><button class="ghost" id="cx">Abbrechen</button><button class="pri" id="ok">Speichern</button></div></div>`;
 fzDraw(l);drawAl();recUi();$('#rb').onclick=recStart;$('#cx').onclick=closeSheet;
 $('#ok').onclick=()=>{const note=$('#nn').value.trim(),hw=$('#hh').value.trim(),o=N[k]||{};
  if(!note&&!hw&&!(o.audio||[]).length)delete N[k];else N[k]={...o,note,hw,done:hw?!!o.done:false,sent:hw==o.hw?(o.sent||[]):[]};
  closeSheet();save();render();runCheck()}}

// ---- Notizen-Übersicht ----
let nq='',ns=-1,nf='';
const allNotes=()=>Object.entries(N).filter(([k,n])=>n&&(n.note||(n.audio||[]).length)).map(([k,n])=>{const i=k.lastIndexOf('|'),l=L.find(x=>lk(x)==k);return{k,n,s:l?l.s:+k.slice(i+1),f:l?fh(l):k.slice(0,i)}});
function rNotes(){
 const fs=[...new Set(allNotes().map(x=>x.f))].sort((a,b)=>a.localeCompare(b,'de'));if(nf&&!fs.includes(nf))nf='';
 $('#main').innerHTML=`<div class="nbar"><input id="nq" type="search" placeholder="Notizen durchsuchen …" value="${esc(nq)}" autocomplete="off"><div class="row2"><select id="nf" aria-label="Nach Fach filtern"><option value="">Alle Fächer</option>${fs.map(f=>`<option value="${esc(f)}" ${f==nf?'selected':''}>${esc(f)}</option>`).join('')}</select><button class="ghost" id="ns"></button></div></div><div id="nl"></div>`;
 $('#nq').oninput=e=>{nq=e.target.value;drawNotes()};$('#nf').onchange=e=>{nf=e.target.value;drawNotes()};$('#ns').onclick=()=>{ns=-ns;drawNotes()};drawNotes()}
function drawNotes(){
 $('#ns').textContent=ns<0?'Neueste zuerst ↓':'Älteste zuerst ↑';
 const q=nq.trim().toLowerCase(),all=allNotes(),a=all.filter(x=>(!nf||x.f==nf)&&(!q||[x.f,x.n.note,fmt(x.s),...(x.n.audio||[]).map(y=>y.text)].join(' ').toLowerCase().includes(q))).sort((p,r)=>(p.s-r.s)*ns);
 $('#nl').innerHTML=a.length?a.map(x=>`<div class="nc" style="--h:${hue(x.f)}"><button class="nt" data-k="${esc(x.k)}"><b>${esc(x.f)}</b><small>${fmt(x.s)}</small>${x.n.note?`<p>${esc(x.n.note)}</p>`:''}</button>${(x.n.audio||[]).map(y=>aRow(x.k,y,false)).join('')}</div>`).join('')
  :`<div class="empty"><b>${all.length?'Nichts gefunden':'Noch keine Notizen'}</b>${all.length?'Suche oder Fach-Filter anpassen.':'Notizen und Audionotizen legst du direkt bei der Stunde im Plan an.'}</div>`}

document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-k]');if(!t)return;const d=t.dataset;
 if(d.t){tab=d.t;history.replaceState(0,'','#'+tab);render()}
 else if(d.go){tab=d.go;render()}
 else if(d.d){day=new Date(+d.d);render()}
 else if(d.w){day=new Date(day);day.setDate(day.getDate()+ +d.w);render()}
 else if(d.c){N[d.c].done=!N[d.c].done;if(!N[d.c].done)N[d.c].sent=[];save();render()}
 else if(d.fz)setFz(d.fz)
 else if(d.p)play(d.p,t)
 else if(d.x){const x=t.parentElement.querySelector('.tr');if(x)x.hidden=!x.hidden}
 else if(d.del)delAudio(d.nk,d.del)
 else if(d.tr){toast('Erkenne Text …');transcribe(d.nk,d.tr,false).then(ok=>{if(ok){toast('Text aktualisiert');curK==d.nk?drawAl():render()}})}
 else if(d.k)openSheet(d.k)});
document.addEventListener('change',e=>{const t=e.target;if(!t.classList||!t.classList.contains('tr'))return;const a=((N[t.dataset.nk]||{}).audio||[]).find(x=>x.id==t.dataset.e);if(a){a.text=t.value.trim();save()}});
$('#sheet').onclick=e=>{if(e.target.id=='sheet')closeSheet()};
$('#sync').onclick=sync;

// ---- Wischen: links = nächster Tag, rechts = voriger Tag ----
(()=>{let x0=0,y0=0,ok=false;const m=$('#main');
 m.addEventListener('touchstart',e=>{ok=tab=='plan'&&e.touches.length==1;x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
 m.addEventListener('touchend',e=>{if(!ok)return;ok=false;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;
  const dir=dx<0?1:-1,has=d=>L.some(l=>sod(l.s).getTime()==d.getTime());
  let d=new Date(day);for(let i=0;i<14;i++){d.setDate(d.getDate()+dir);if(d.getDay()%6||has(d))break}
  day=sod(d);render();m.style.setProperty('--dx',dir);m.classList.remove('sw');void m.offsetWidth;m.classList.add('sw')},{passive:true});
 m.addEventListener('touchcancel',()=>ok=false,{passive:true})})();
// ---- Menü beim Runterscrollen ausblenden, beim Raufscrollen zeigen ----
(()=>{let y=scrollY;addEventListener('scroll',()=>{const c=scrollY;if(Math.abs(c-y)<8)return;$('nav').classList.toggle('hide',c>y&&c>80);y=c},{passive:true})})();
addEventListener('online',render);addEventListener('offline',render);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();runCheck()}});setInterval(runCheck,60000);

(async()=>{
 try{const s=await idbGet();if(s)for(const k in s.N)if(N[k])N[k].sent=[...new Set([...(N[k].sent||[]),...(s.N[k].sent||[])])]}catch{}
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 render();save();runCheck();
 if((S.url||(S.m&&(S.m.key||S.m.pw)))&&navigator.onLine&&Date.now()-S.at>6*36e5)sync()})();
</script></body></html>
